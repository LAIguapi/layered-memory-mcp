name: layered-memory-guard
version: "3.4.2"
description: "Write guard for the layered-memory framework — keeps agent-side writes out of the framework-owned MEMORY.md (blocks the memory tool with target=memory and direct write_file/patch edits of memories/MEMORY.md), and points the model at inject_knowledge (L1) or target='user' instead."

provides_hooks:
  - pre_tool_call
