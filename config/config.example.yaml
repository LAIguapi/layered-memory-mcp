# =============================================================================
# Auto-extractor domain classification (optional)
# =============================================================================
#
# The knowledge auto-extractor ships with **zero** built-in domain presets: by
# default every extracted entry is tagged with the fallback domain "general".
# The framework makes no assumption about your subject matter.
#
# If you want the extractor to auto-classify entries into your own domains,
# provide a `domain_keywords` mapping (same shape as the rules above). It can be
# passed programmatically:
#
#     MemoryConfig(domain_keywords={
#         "database":   ["sql", "query", "index"],
#         "networking": ["tcp", "dns", "proxy"],
#     })
#
# or via the env var (JSON object):
#
#     LAYERED_MEMORY_DOMAIN_KEYWORDS='{"database": ["sql", "query", "index"],
#                                      "networking": ["tcp", "dns", "proxy"]}'
#
# Keywords are matched case-insensitively; the highest-scoring domain wins, and
# content matching nothing stays "general". Use whatever domains fit your own
# knowledge base.
# =============================================================================

# =============================================================================
# MEMORY.md write guard (optional)
# =============================================================================
#
# The framework keeps the agent's MEMORY.md for itself (one index entry). When
# the host agent is Hermes, a bundled pre_tool_call plugin can stop agent-side
# writes to that file — the memory tool with target="memory", and write_file /
# patch aimed at memories/MEMORY.md — and point the model at inject_knowledge
# (L1 knowledge) or target="user" (the user profile) instead.
#
# Policy values:
#   manual — init_framework only reports whether the guard is missing (default:
#            the host agent's config belongs to the user)
#   auto   — init_framework installs or repairs the guard on its own
#   off    — never mentioned
#
# Set it in <home>/config.yaml:
#
#     write_guard: auto
#
# or via the env var (same name, highest priority after the constructor arg):
#
#     LAYERED_MEMORY_WRITE_GUARD=auto
#
# The deployed plugin also reads LAYERED_MEMORY_WRITE_GUARD as a runtime kill
# switch: "off" disables blocking without uninstalling anything.
#
# Install/remove from an agent session:
#     integrate_agent(action="install_guard")   # deploy + enable + silence nudge
#     integrate_agent(action="remove_guard")    # uninstall + restore nudge
# =============================================================================

# =============================================================================
# Agent environment adapter + agent memory write safety (optional)
# =============================================================================
#
# WHICH AGENT'S FILES
# -------------------
# The common core holds no product paths. Where the host agent keeps its own
# memory file, which character separates the entries in it, where its live
# session database lives and how many characters it allows are all answered by
# an *environment adapter* (src/layered_memory_mcp/adapters/).
#
#     agent_memory:
#       adapter: auto     # default
#
# Values:
#   auto        probe the registry in order — hermes, claude_code, cursor,
#               cline, then a generic adapter that knows only this framework's
#               own home. This is the backward-compatible default and resolves
#               exactly what the pre-adapter core resolved.
#   hermes      pin Hermes: ~/.hermes/memories/MEMORY.md, '§' separator,
#               ~/.hermes/state.db, the limit read back from ~/.hermes/config.yaml
#   claude_code pin ~/.claude/CLAUDE.md
#   cursor      pin ./.cursorrules
#   cline       pin ~/.cline/rules
#   generic     know no product paths at all; only <home>/agent-memory.md
#   none / off  alias for generic
#
# An unknown id falls back to `generic` with a warning — never silently to
# Hermes. Register your own with
# `adapters.environment.environments.register(MyAdapter(), priority=15)`;
# no core file needs editing.
#
# Env equivalent: LAYERED_MEMORY_AGENT_ADAPTER=hermes
#
# `get_memory_surface_capabilities()` reports the result as
# `agent_environment: {configured, resolved, known, entry_separator, ...}`.
#
# WRITE SAFETY
# ------------
# The framework projects an L0 pointer / knowledge-index entry into the agent's
# own memory file. When no path is configured it *auto-detects* one through the
# adapter, which is fine for reading but dangerous for writing: any ambiguous
# config — a test, a throwaway script built on a temp home — resolves the real
# file and silently appends to it. Detection is not permission.
#
# So a projection write needs an explicit target or an explicit opt-in:
#
#     agent_memory:
#       path: /home/example/.hermes/memories/MEMORY.md   # explicit target (recommended)
#       allow_auto_detect_write: false                  # or opt back into auto-detect
#       separator: null                                 # override the adapter's separator
#
# Env equivalents (highest priority):
#     LAYERED_MEMORY_AGENT_MEMORY_PATH=/path/to/MEMORY.md
#     LAYERED_MEMORY_AGENT_MEMORY_ALLOW_AUTO_DETECT_WRITE=true
#     LAYERED_MEMORY_AGENT_MEMORY_SEPARATOR='§'
#
# With neither set, auto-detected writes are still allowed in exactly two
# cases: the detected file lives inside <home> (the framework owns that dir),
# or <home> is this install's real configured home and not a temp/test sandbox
# — which is what keeps an existing deployment's projection working after an
# upgrade. Anything else is refused and reported, e.g.
#
#     "agent_memory_write": {
#       "status": "skipped",
#       "reason": "unsafe_auto_detect_write",
#       "detected_path": "/home/example/.hermes/memories/MEMORY.md",
#       "hint": "Set agent_memory.path ..."
#     }
#
# The primary L1 write always succeeds regardless — only the projection stops.
# =============================================================================

# =============================================================================
# Persistence routing: two enforcement switches (optional)
# =============================================================================
#
# The router classifies every candidate item into a surface — the
# framework-owned common core (l0_index / l1_knowledge / todo /
# memory_changelog), an agent-owned extension recommendation (skill /
# user_profile / agent_other), or no durable write. It is deterministic: marker
# and structure rules, no model call.
#
# In <home>/config.yaml:
#
#     routing:
#       enabled: true
#       mode: advisory               # advisory | enforce
#       enforce_direct_writes: false # strict gate for explicit writes
#
# The two switches are independent on purpose, because they govern two
# different questions:
#
#   mode: enforce
#       Gates compact_memory — the path where the FRAMEWORK picks the target.
#       Only l1_knowledge entries are migrated into L1; TODO, skill, profile,
#       agent-other, undecided and ephemeral entries are left in agent memory
#       and returned as candidates. It never refuses an explicit write.
#
#   enforce_direct_writes: true
#       Gates inject_knowledge / batch_inject_knowledge_tool — the path where
#       the CALLER picks the target. Content that classifies as a POSITIVE
#       non-L1 surface (skill, user_profile, agent_other, todo, ephemeral) is
#       refused before the write (action="routing_refused"); nothing is
#       written and no MEMORY_CHANGELOG event is recorded. The result carries
#       the routing decision and the AgentAction to take instead.
#
#       "undecided" is NOT refused: it means no rule matched, and absence of
#       evidence is not evidence of a misfile. The write proceeds to L1 with a
#       routing_warning and routing_enforcement.insufficient_evidence: true.
#
#       The gate does not reach the whole-file tools create_knowledge_file /
#       update_knowledge_file — those bypass the router entirely.
#
#       Override one call with routing_override="force_l1" when the classifier
#       is wrong about a piece of durable knowledge. It is not a way to push a
#       runbook or a preference into L1 — those have their own surfaces.
#
# Defaults are the compatible ones (advisory + no direct-write gate): an
# explicit write still lands in L1 and carries a routing_warning. With
# routing.enabled: false, enforce_direct_writes is inert — there is no
# classification to enforce.
#
# Env equivalents:
#     LAYERED_MEMORY_ROUTING_ENABLED=true
#     LAYERED_MEMORY_ROUTING_MODE=advisory
#     LAYERED_MEMORY_ROUTING_ENFORCE_DIRECT_WRITES=false
#
# get_memory_surface_capabilities() reports both switches, and the
# l1_knowledge note says which one you are living under.
# =============================================================================
